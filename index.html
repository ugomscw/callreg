<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Реестр звонков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;
  --surface:#ffffff;
  --surface-2:#eceff4;
  --border:#dde1e8;
  --text:#1b2330;
  --text-muted:#5c6673;
  --text-faint:#8992a1;
  --accent:#2a5aa0;
  --accent-soft:#e7eefb;
  --accent-strong:#1c3f74;
  --success:#20844f;
  --success-soft:#e2f4ea;
  --warning:#a9711a;
  --warning-soft:#faf0dd;
  --danger:#c23b32;
  --danger-soft:#fbe8e6;
  --neutral:#6b7280;
  --neutral-soft:#eceef1;
  --info:#2a5aa0;
  --info-soft:#e7eefb;
  --task:#7c5cbf;
  --task-soft:#f1ecfa;
  --rc-yellow:#fbf0c8;
  --rc-green:#dcf0d9;
  --rc-blue:#dbe8fa;
  --rc-pink:#fbdfec;
  --rc-purple:#e9ddf9;
  --rc-orange:#fce2cc;
  --rc-gray:#e7e9ee;
  --overlay: rgba(20,26,38,0.45);
  --shadow: 0 1px 2px rgba(20,30,50,0.06), 0 8px 24px -12px rgba(20,30,50,0.12);
  --shadow-lg: 0 20px 60px -20px rgba(20,30,50,0.35);
  --radius: 10px;
  font-variant-numeric: tabular-nums;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161d;
    --surface:#1a1f28;
    --surface-2:#212733;
    --border:#2c3340;
    --text:#e7ebf1;
    --text-muted:#9aa4b2;
    --text-faint:#6b7686;
    --accent:#6f9de0;
    --accent-soft:#213351;
    --accent-strong:#9dc0f2;
    --success:#57c489;
    --success-soft:#173226;
    --warning:#e0ab52;
    --warning-soft:#372b13;
    --danger:#e8776c;
    --danger-soft:#3a1e1c;
    --neutral:#9aa4b2;
    --neutral-soft:#242a35;
    --info:#6f9de0;
    --info-soft:#1c2c47;
    --task:#b096e0;
    --task-soft:#2b2140;
    --rc-yellow:#3d3620;
    --rc-green:#20351f;
    --rc-blue:#1f2c40;
    --rc-pink:#3a2333;
    --rc-purple:#2f2445;
    --rc-orange:#3c2a1a;
    --rc-gray:#2a2f3a;
    --overlay: rgba(4,6,10,0.6);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg: 0 20px 60px -20px rgba(0,0,0,0.7);
  }
}
:root[data-theme="dark"]{
  --bg:#12161d;
  --surface:#1a1f28;
  --surface-2:#212733;
  --border:#2c3340;
  --text:#e7ebf1;
  --text-muted:#9aa4b2;
  --text-faint:#6b7686;
  --accent:#6f9de0;
  --accent-soft:#213351;
  --accent-strong:#9dc0f2;
  --success:#57c489;
  --success-soft:#173226;
  --warning:#e0ab52;
  --warning-soft:#372b13;
  --danger:#e8776c;
  --danger-soft:#3a1e1c;
  --neutral:#9aa4b2;
  --neutral-soft:#242a35;
  --info:#6f9de0;
  --info-soft:#1c2c47;
  --task:#b096e0;
  --task-soft:#2b2140;
  --rc-yellow:#3d3620;
  --rc-green:#20351f;
  --rc-blue:#1f2c40;
  --rc-pink:#3a2333;
  --rc-purple:#2f2445;
  --rc-orange:#3c2a1a;
  --rc-gray:#2a2f3a;
  --overlay: rgba(4,6,10,0.6);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  --shadow-lg: 0 20px 60px -20px rgba(0,0,0,0.7);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono", ui-monospace, monospace;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

.page{
  max-width:1680px;
  margin:0 auto;
  padding:28px 20px 64px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* header */
.masthead{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  border-bottom:1px solid var(--border);
  padding-bottom:16px;
}
.masthead h1{
  font-size:22px;
  font-weight:700;
  margin:0;
  letter-spacing:-0.01em;
  text-wrap:balance;
}
.masthead .eyebrow{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--accent);
  margin:0 0 4px;
}
.masthead .meta{
  font-size:12.5px;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:8px;
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:none;}
.sync-dot.off{background:var(--danger);}
.sync-dot.pending{background:var(--warning);}

/* stat tiles */
.stats{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:1px;
  background:var(--border);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.stat{
  background:var(--surface);
  padding:14px 16px;
  display:flex;
  flex-direction:column;
  gap:6px;
  cursor:pointer;
  border:none;
  text-align:left;
  font-family:inherit;
  color:inherit;
  transition:background .12s ease;
}
.stat:hover{background:var(--surface-2);}
.stat.active{background:var(--accent-soft);}
.stat .n{
  font-family:"IBM Plex Mono",monospace;
  font-size:26px;
  font-weight:600;
  line-height:1;
}
.stat .label{
  font-size:11.5px;
  color:var(--text-muted);
  display:flex;
  align-items:center;
  gap:6px;
}
.dot{width:8px;height:8px;border-radius:50%;flex:none;}
.dot.total{background:var(--text-faint);}
.dot.success{background:var(--success);}
.dot.warning{background:var(--warning);}
.dot.info{background:var(--info);}
.dot.danger{background:var(--danger);}
.dot.neutral{background:var(--neutral);}
.dot.task{background:var(--task);}
.stat.active .n{color:var(--accent-strong);}

@media (max-width:1050px){
  .stats{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,1fr);}
}

/* controls */
.controls{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.search{
  position:relative;
  flex:1 1 260px;
  min-width:200px;
}
.search svg{
  position:absolute;
  left:11px; top:50%;
  transform:translateY(-50%);
  color:var(--text-faint);
  pointer-events:none;
}
.search input{
  width:100%;
  padding:9px 12px 9px 34px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:13.5px;
  font-family:inherit;
}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;}

.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:9px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.btn.danger-ghost{color:var(--danger);border-color:transparent;background:transparent;padding:9px 10px;}
.btn.danger-ghost:hover{background:var(--danger-soft);}
.btn.ghost{border-color:transparent;background:transparent;padding:9px 10px;}
.btn.ghost:hover{background:var(--surface-2);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}

.count-line{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  color:var(--text-faint);
  padding:0 2px;
}

/* table */
.table-wrap{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  overflow:auto;
  box-shadow:var(--shadow);
  max-height:80vh;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12.8px;
  min-width:1360px;
}
thead th{
  position:sticky;
  top:0;
  background:var(--surface-2);
  text-align:left;
  padding:10px 12px;
  font-size:10.8px;
  font-weight:600;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--text-muted);
  border-bottom:1px solid var(--border);
  cursor:pointer;
  user-select:none;
  white-space:nowrap;
  z-index:1;
}
thead th.no-sort{cursor:default;}
thead th:hover{color:var(--text);}
thead th .arrow{opacity:0.5;margin-left:3px;font-size:10px;}
tbody tr{border-bottom:1px solid var(--border);}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.has-color{background:var(--row-bg);}
tbody tr.has-color:hover{background:var(--row-bg);filter:brightness(0.95);}
td{
  padding:9px 12px;
  vertical-align:top;
  color:var(--text);
}
td.name{font-weight:600;max-width:210px;}
td.name .city{
  display:block;
  font-weight:400;
  color:var(--text-faint);
  font-size:11.5px;
  margin-top:1px;
}
td.name .inn{
  display:block;
  font-weight:400;
  color:var(--text-faint);
  font-size:11px;
  margin-top:1px;
  font-family:"IBM Plex Mono",monospace;
}
td.contact{max-width:220px;}
.contact-block{margin-bottom:8px;}
.contact-block:last-child{margin-bottom:0;}
.contact-block .cname{font-weight:600;display:block;}
.contact-block .cpos{display:block;color:var(--text-faint);font-size:11.3px;margin-top:1px;}
.contact-block .cphone{display:block;margin-top:2px;font-size:12px;}
.contact-block .cphone a{color:var(--accent);text-decoration:none;}
.contact-block .cphone a:hover{text-decoration:underline;}
.contact-block .cemail{display:block;margin-top:1px;font-size:11.5px;}
.contact-block .cemail a{color:var(--text-faint);text-decoration:none;}
.contact-block .cemail a:hover{color:var(--accent);text-decoration:underline;}
td.comment{max-width:230px;padding:5px 6px;}
td.task{max-width:210px;padding:5px 6px;}
textarea.inline-edit{
  display:block;
  width:100%;
  min-width:200px;
  min-height:44px;
  resize:vertical;
  border:1px solid transparent;
  border-radius:6px;
  background:transparent;
  color:var(--text);
  font-family:inherit;
  font-size:12.8px;
  line-height:1.45;
  padding:4px 6px;
}
textarea.inline-edit::placeholder{color:var(--text-faint);}
textarea.inline-edit:hover{border-color:var(--border);}
textarea.inline-edit:focus{border-color:var(--accent);background:var(--surface);outline:none;}
td.date{white-space:nowrap;color:var(--text-muted);}
td.link a{color:var(--accent);text-decoration:none;font-size:12px;white-space:nowrap;font-weight:600;}
td.link a:hover{text-decoration:underline;}
td.empty-cell{color:var(--text-faint);}
td.actions{white-space:nowrap;text-align:right;}

.status-select{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid transparent;
  border-radius:99px;
  padding:4px 24px 4px 9px;
  font-size:11px;
  font-weight:600;
  font-family:inherit;
  cursor:pointer;
  background-repeat:no-repeat;
  background-position:right 8px center;
  background-size:9px;
}
.status-select:hover{border-color:var(--border);}
.status-select.s-success{background-color:var(--success-soft);color:var(--success);}
.status-select.s-info{background-color:var(--info-soft);color:var(--info);}
.status-select.s-warning{background-color:var(--warning-soft);color:var(--warning);}
.status-select.s-danger{background-color:var(--danger-soft);color:var(--danger);}
.status-select.s-neutral{background-color:var(--neutral-soft);color:var(--neutral);}

.next-date-input{
  border:1px solid var(--border);
  border-radius:6px;
  padding:4px 7px;
  font-family:"IBM Plex Mono",monospace;
  font-size:11.5px;
  font-weight:500;
  background:var(--surface);
  color-scheme:light dark;
}
.next-date-input.overdue{background:var(--danger-soft);color:var(--danger);border-color:transparent;}
.next-date-input.today{background:var(--success-soft);color:var(--success);border-color:transparent;}
.next-date-input.soon{background:var(--warning-soft);color:var(--warning);border-color:transparent;}
.next-date-input.later{color:var(--text-muted);}

.icon-btn{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  width:28px;height:28px;
  border-radius:7px;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;
  font-size:13px;
  margin-left:4px;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger);border-color:transparent;}

.empty-state{
  padding:48px 20px;
  text-align:center;
  color:var(--text-faint);
  font-size:13px;
}
.empty-state .btn{margin-top:12px;}

.footer-note{
  font-size:11.5px;
  color:var(--text-faint);
  text-align:center;
  padding-top:8px;
}

/* drawer */
.overlay{
  position:fixed;inset:0;
  background:var(--overlay);
  display:flex;justify-content:flex-end;
  z-index:50;
}
.overlay[hidden]{display:none;}
.drawer{
  width:min(480px, 100vw);
  height:100%;
  background:var(--surface);
  box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;
  animation:slidein .16s ease;
}
@keyframes slidein{from{transform:translateX(24px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.drawer-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);
  flex:none;
}
.drawer-head h2{font-size:16px;margin:0;font-weight:700;}
.drawer-body{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px;}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex:none;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}
.field input, .field select, .field textarea{
  border:1px solid var(--border);
  border-radius:7px;
  padding:8px 10px;
  font-size:13.5px;
  font-family:inherit;
  background:var(--surface);
  color:var(--text);
  color-scheme:light dark;
  width:100%;
}
.field textarea{resize:vertical;min-height:56px;font-family:inherit;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.contacts-editor{display:flex;flex-direction:column;gap:10px;}
.contact-card{
  border:1px solid var(--border);
  border-radius:9px;
  padding:12px;
  display:flex;flex-direction:column;gap:8px;
  background:var(--surface-2);
  position:relative;
}
.contact-card .remove-contact{
  position:absolute;top:8px;right:8px;
}
.section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;justify-content:space-between;}

.color-swatches{display:flex;flex-wrap:wrap;gap:8px;}
.swatch{
  width:30px;height:30px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--text);
  font-size:13px;
  line-height:1;
}
.swatch:hover{border-color:var(--border);}
.swatch.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.swatch.none{background:var(--surface);border:1.5px dashed var(--border);color:var(--text-faint);}
</style>
</head>
<body>

<div class="page">

  <header class="masthead">
    <div>
      <p class="eyebrow">Отдел продаж &middot; Мурадалиев М.М.</p>
      <h1>Реестр звонков по клиентам</h1>
    </div>
    <div class="meta"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Подключение…</span></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Поиск по клиенту, ИНН, городу, контакту, телефону…">
    </div>
    <button class="btn primary" id="add-client">+ Добавить клиента</button>
  </div>

  <p class="count-line"><span id="count-line"></span></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-key="date">📅 Дата звонка<span class="arrow"></span></th>
          <th data-key="name">🏢 Клиент<span class="arrow"></span></th>
          <th class="no-sort">👤 Контакт</th>
          <th data-key="status">🚦 Статус<span class="arrow"></span></th>
          <th data-key="next_date">⏰ След. звонок<span class="arrow"></span></th>
          <th class="no-sort">💬 Комментарий</th>
          <th class="no-sort">📝 Задача</th>
          <th class="no-sort">🔗 Bitrix24</th>
          <th class="no-sort"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <p class="footer-note" id="footer-note">Загрузка…</p>

</div>

<div class="overlay" id="auth-overlay" style="justify-content:center;align-items:center;" hidden>
  <div class="drawer" style="width:min(360px,92vw);height:auto;border-radius:14px;">
    <div class="drawer-head">
      <h2>🔒 Код доступа</h2>
    </div>
    <div class="drawer-body">
      <div class="field">
        <label>Введите код, чтобы открыть реестр</label>
        <input type="password" id="auth-input" placeholder="XXXX-XXXX-XXXX" autocomplete="off">
      </div>
      <p id="auth-error" style="color:var(--danger);font-size:12.5px;margin:0;min-height:16px;"></p>
    </div>
    <div class="drawer-foot" style="justify-content:flex-end;">
      <button class="btn primary" id="auth-submit">Войти</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="drawer-title">Карточка клиента</h2>
      <button class="icon-btn" id="drawer-close" aria-label="Закрыть">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <button class="btn danger-ghost" id="drawer-delete">🗑 Удалить клиента</button>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" id="drawer-cancel">Отмена</button>
        <button class="btn primary" id="drawer-save">Сохранить</button>
      </div>
    </div>
  </div>
</div>

<script>
const STATUS_META = {
  'Дозвонился':    {tone:'success'},
  'Не дозвонился': {tone:'danger'},
  'Перезвонить':   {tone:'warning'},
  'Позвонить':     {tone:'info'},
  'Не актуально':  {tone:'neutral'},
};
const STATUS_LIST = ['Дозвонился','Перезвонить','Позвонить','Не дозвонился','Не актуально'];
const ROW_COLORS = ['yellow','green','blue','pink','purple','orange','gray'];

const TILES = [
  {key:'__all', label:'Всего клиентов', dot:'total'},
  {key:'__task', label:'Задачи', dot:'task'},
  {key:'Дозвонился', label:'Дозвонился', dot:'success'},
  {key:'Перезвонить', label:'Перезвонить', dot:'warning'},
  {key:'Позвонить', label:'Позвонить', dot:'info'},
  {key:'Не дозвонился', label:'Не дозвонился', dot:'danger'},
  {key:'Не актуально', label:'Не актуально', dot:'neutral'},
];

function parseRuDate(s){
  if(!s) return null;
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function ruToIso(s){
  const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec(s||'');
  return m ? `${m[3]}-${m[2]}-${m[1]}` : '';
}
function isoToRu(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');
  return m ? `${m[3]}.${m[2]}.${m[1]}` : null;
}

const TODAY = new Date();
TODAY.setHours(0,0,0,0);

const API_URL = 'https://script.google.com/macros/s/AKfycbyJ3Sm1vJifyX7ErxaitEG2XnRMRSAvUN5EHSRLs2oAPpk85ke4LMNZYShluKVxazpYpw/exec'; // из Deploy → Web app в Apps Script

let ALL = [];
let activeTab = '__all';
let sortKey = null;
let sortDir = 1;
let query = '';
let draft = null; // working copy while drawer open
let draftId = null;
let draftIsNew = false;

const tbody = document.getElementById('tbody');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toneOf(status){ return (STATUS_META[status] || {tone:'neutral'}).tone; }
function hasTask(r){ return !!(r.task && String(r.task).trim()); }
function countBy(key){
  if(key === '__all') return ALL.length;
  if(key === '__task') return ALL.filter(hasTask).length;
  return ALL.filter(r => (r.status||'Новый') === key).length;
}

function renderStats(){
  statsEl.innerHTML = TILES.map(t => `
    <button class="stat ${activeTab===t.key?'active':''}" data-key="${t.key}">
      <span class="n">${countBy(t.key)}</span>
      <span class="label"><span class="dot ${t.dot}"></span>${t.label}</span>
    </button>
  `).join('');
  statsEl.querySelectorAll('.stat').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeTab = btn.dataset.key; renderAll(); });
  });
}
function matchesQuery(r, q){
  if(!q) return true;
  q = q.toLowerCase();
  const contactBits = (r.contacts||[]).flatMap(c=>[c.name,c.position,c.phone,c.phone2,c.email]);
  return [r.name, r.inn, r.city, r.comment, r.task, ...contactBits]
    .filter(Boolean).some(v => String(v).toLowerCase().includes(q));
}
function nextDateInfo(d){
  const dt = parseRuDate(d);
  if(!dt) return {cls:'later'};
  const diffDays = Math.round((dt - TODAY) / 86400000);
  if(diffDays < 0) return {cls:'overdue'};
  if(diffDays === 0) return {cls:'today'};
  if(diffDays <= 2) return {cls:'soon'};
  return {cls:'later'};
}
function phoneLink(phone){
  if(!phone) return '';
  const digits = phone.replace(/[^\d+]/g,'');
  if(digits.length < 5) return escapeHtml(phone);
  return `<a href="tel:${digits}">${escapeHtml(phone)}</a>`;
}
function contactsHtml(contacts){
  if(!contacts || contacts.length===0) return '<span class="empty-cell">—</span>';
  return contacts.map(c=>`
    <div class="contact-block">
      ${c.name?`<span class="cname">${escapeHtml(c.name)}</span>`:''}
      ${c.position?`<span class="cpos">${escapeHtml(c.position)}</span>`:''}
      ${c.phone?`<span class="cphone mono">${phoneLink(c.phone)}</span>`:''}
      ${c.phone2?`<span class="cphone mono">${phoneLink(c.phone2)}</span>`:''}
      ${c.email?`<span class="cemail"><a href="mailto:${escapeHtml(c.email)}">${escapeHtml(c.email)}</a></span>`:''}
    </div>
  `).join('');
}

function matchesTab(r){
  if(activeTab === '__all') return true;
  if(activeTab === '__task') return hasTask(r);
  return (r.status||'Новый') === activeTab;
}
function getRows(){
  let rows = ALL.filter(r => matchesTab(r) && matchesQuery(r, query));
  if(sortKey){
    rows = rows.slice().sort((a,b)=>{
      let av, bv;
      if(sortKey === 'date' || sortKey === 'next_date'){
        av = parseRuDate(a[sortKey]); bv = parseRuDate(b[sortKey]);
        av = av ? av.getTime() : -Infinity;
        bv = bv ? bv.getTime() : -Infinity;
      } else if(sortKey === 'status'){
        av = (a.status||'Новый').toLowerCase(); bv = (b.status||'Новый').toLowerCase();
      } else {
        av = (a[sortKey] || '').toString().toLowerCase();
        bv = (b[sortKey] || '').toString().toLowerCase();
      }
      if(av < bv) return -1*sortDir;
      if(av > bv) return 1*sortDir;
      return 0;
    });
  } else {
    rows = rows.slice().sort((a,b)=>(a.order??0)-(b.order??0));
  }
  return rows;
}

const AUTH_KEY_STORAGE = 'callRegistryAccessKey';
function getAuthKey(){
  try{ return localStorage.getItem(AUTH_KEY_STORAGE) || ''; }catch(e){ return ''; }
}
function setAuthKey(k){
  try{ localStorage.setItem(AUTH_KEY_STORAGE, k); }catch(e){}
}
function showAuthGate(message){
  document.getElementById('auth-error').textContent = message || '';
  document.getElementById('auth-overlay').hidden = false;
  document.getElementById('auth-input').focus();
}
function hideAuthGate(){
  document.getElementById('auth-overlay').hidden = true;
}
function checkAuthResponse_(json){
  if(json && json.error === 'unauthorized'){
    showAuthGate('Неверный код доступа');
    throw new Error('unauthorized');
  }
}
function apiUrlWithKey_(){
  const sep = API_URL.indexOf('?') === -1 ? '?' : '&';
  return API_URL + sep + 'key=' + encodeURIComponent(getAuthKey());
}
async function apiList(){
  const res = await fetch(apiUrlWithKey_(), {method:'GET'});
  const json = await res.json();
  checkAuthResponse_(json);
  if(!json.ok) throw new Error(json.error || 'list_failed');
  return json.clients;
}
async function apiUpsert(obj){
  const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'upsert', data: obj, key: getAuthKey()})});
  const json = await res.json();
  checkAuthResponse_(json);
  if(!json.ok) throw new Error(json.error || 'upsert_failed');
  return json;
}
async function apiDelete(id){
  const res = await fetch(API_URL, {method:'POST', body: JSON.stringify({action:'delete', id, key: getAuthKey()})});
  const json = await res.json();
  checkAuthResponse_(json);
  if(!json.ok) throw new Error(json.error || 'delete_failed');
  return json;
}
function newId(){
  return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

async function setDate(id, ruDate){
  const row = ALL.find(r=>r.id===id);
  if(!row) return;
  row.date = ruDate || null;
  renderAll();
  try{ await apiUpsert(row); }catch(e){ console.error(e); setSync('off','Ошибка сохранения'); }
}
async function setStatus(id, status){
  const row = ALL.find(r=>r.id===id);
  if(!row) return;
  row.status = status || null;
  renderAll();
  try{ await apiUpsert(row); }catch(e){ console.error(e); setSync('off','Ошибка сохранения'); }
}
async function setNextDate(id, ruDate){
  const row = ALL.find(r=>r.id===id);
  if(!row) return;
  row.next_date = ruDate || null;
  renderAll();
  try{ await apiUpsert(row); }catch(e){ console.error(e); setSync('off','Ошибка сохранения'); }
}
async function deleteClient(id){
  ALL = ALL.filter(r=>r.id!==id);
  renderAll();
  try{ await apiDelete(id); }catch(e){ console.error(e); setSync('off','Ошибка сохранения'); }
}

let pendingTableRender = false;
function renderTable(){
  if(document.activeElement && document.activeElement.classList.contains('inline-edit')){
    pendingTableRender = true;
    return;
  }
  pendingTableRender = false;
  const rows = getRows();
  countLine.textContent = `Показано ${rows.length} из ${ALL.length}`;
  if(rows.length === 0){
    tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state">Ничего не найдено</div></td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r=>{
    const nd = nextDateInfo(r.next_date);
    const status = r.status || '';
    const colorAttr = r.color ? ` class="has-color" style="--row-bg:var(--rc-${r.color})"` : '';
    return `<tr data-id="${r.id}"${colorAttr}>
      <td class="date">
        <input type="date" class="next-date-input" data-action="date" data-id="${r.id}" value="${ruToIso(r.date)}">
      </td>
      <td class="name">${escapeHtml(r.name || 'Без названия')}${r.inn?`<span class="inn">${escapeHtml(r.inn)}</span>`:''}${r.city?`<span class="city">${escapeHtml(r.city)}</span>`:''}</td>
      <td class="contact">${contactsHtml(r.contacts)}</td>
      <td>
        <select class="status-select s-${toneOf(status||'Новый')}" data-action="status" data-id="${r.id}">
          <option value="" ${!status?'selected':''}>— Новый —</option>
          ${STATUS_LIST.map(s=>`<option value="${s}" ${status===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td class="date">
        <input type="date" class="next-date-input ${nd.cls}" data-action="next_date" data-id="${r.id}" value="${ruToIso(r.next_date)}">
      </td>
      <td class="comment"><textarea class="inline-edit" data-action="comment" data-id="${r.id}" placeholder="Комментарий…">${escapeHtml(r.comment||'')}</textarea></td>
      <td class="task"><textarea class="inline-edit" data-action="task" data-id="${r.id}" placeholder="Задача…">${escapeHtml(r.task||'')}</textarea></td>
      <td class="link">${r.link?`<a href="${escapeHtml(r.link)}" target="_blank" rel="noopener">Открыть →</a>`:'<span class="empty-cell">—</span>'}</td>
      <td class="actions">
        <button class="icon-btn" data-action="edit" data-id="${r.id}" title="Редактировать" aria-label="Редактировать">✏️</button>
        <button class="icon-btn danger" data-action="delete" data-id="${r.id}" title="Удалить" aria-label="Удалить">🗑</button>
      </td>
    </tr>`;
  }).join('');
}

tbody.addEventListener('change', e=>{
  const el = e.target;
  const action = el.dataset.action;
  const id = el.dataset.id;
  if(action === 'status') setStatus(id, el.value);
  if(action === 'next_date') setNextDate(id, isoToRu(el.value));
  if(action === 'date') setDate(id, isoToRu(el.value));
});
tbody.addEventListener('focusout', e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains('inline-edit')) return;
  const action = el.dataset.action;
  const id = el.dataset.id;
  const val = el.value.trim() || null;
  const row = ALL.find(r=>r.id===id);
  if(!row) return;
  if((row[action]||null) === val){
    if(pendingTableRender) renderTable();
    return;
  }
  row[action] = val;
  apiUpsert(row).then(()=>{
    if(pendingTableRender) renderTable();
  }).catch(err=>{ console.error(err); setSync('off','Ошибка сохранения'); });
});
tbody.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;
  if(action === 'edit') openDrawer(id);
  if(action === 'delete'){
    const row = ALL.find(r=>r.id===id);
    if(confirm(`Удалить клиента «${row?row.name:id}»?`)) deleteClient(id);
  }
});

document.querySelectorAll('thead th[data-key]').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(sortKey === key){ sortDir *= -1; } else { sortKey = key; sortDir = 1; }
    document.querySelectorAll('thead th .arrow').forEach(a=>a.textContent='');
    const arrow = th.querySelector('.arrow');
    if(arrow) arrow.textContent = sortDir===1 ? '↑' : '↓';
    renderTable();
  });
});

searchInput.addEventListener('input', e=>{ query = e.target.value; renderAll(); });

function renderAll(){
  renderStats();
  renderTable();
}

function emptyClient(order){
  return {name:'', inn:'', city:'', date:null, contacts:[{name:'',position:'',phone:'',phone2:'',email:''}],
           status:null, next_date:null, comment:'', task:'', link:'', color:null, order};
}

function openDrawer(id){
  const row = ALL.find(r=>r.id===id);
  if(!row) return;
  draftId = id;
  draftIsNew = false;
  draft = JSON.parse(JSON.stringify(row));
  if(!draft.contacts || draft.contacts.length===0) draft.contacts = [{name:'',position:'',phone:'',phone2:'',email:''}];
  drawerTitle.textContent = row.name || 'Карточка клиента';
  renderDrawer();
  overlay.hidden = false;
}
function openDrawerNew(){
  const maxOrder = ALL.reduce((m,r)=>Math.max(m, r.order||0), 0);
  draftId = null;
  draftIsNew = true;
  draft = emptyClient(maxOrder+1);
  drawerTitle.textContent = 'Новый клиент';
  renderDrawer();
  overlay.hidden = false;
}
function closeDrawer(){
  overlay.hidden = true;
  draft = null; draftId = null; draftIsNew = false;
}
document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-cancel').addEventListener('click', closeDrawer);
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeDrawer(); });

document.getElementById('add-client').addEventListener('click', openDrawerNew);

document.getElementById('drawer-save').addEventListener('click', async ()=>{
  const saveBtn = document.getElementById('drawer-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Сохранение…';
  try{
    if(!draft) throw new Error('Карточка не открыта — попробуйте ещё раз');
    const cleanContacts = (draft.contacts||[])
      .map(c=>({name:(c.name||'').trim()||null, position:(c.position||'').trim()||null, phone:(c.phone||'').trim()||null, phone2:(c.phone2||'').trim()||null, email:(c.email||'').trim()||null}))
      .filter(c=>c.name || c.position || c.phone || c.phone2 || c.email);
    const id = draftIsNew ? newId() : draftId;
    const payload = {
      id,
      name: (draft.name||'').trim() || 'Без названия',
      inn: (draft.inn||'').trim() || null,
      city: (draft.city||'').trim() || null,
      date: draft.date || null,
      next_date: draft.next_date || null,
      status: draft.status || null,
      comment: (draft.comment||'').trim() || null,
      task: (draft.task||'').trim() || null,
      link: (draft.link||'').trim() || null,
      contacts: cleanContacts,
      color: draft.color || null,
      order: draft.order ?? 0,
    };
    await apiUpsert(payload);
    const idx = ALL.findIndex(r=>r.id===id);
    if(idx === -1) ALL.push(payload); else ALL[idx] = payload;
    renderAll();
    closeDrawer();
  }catch(e){
    console.error(e);
    alert('Не удалось сохранить: ' + (e && e.message ? e.message : e));
  }finally{
    saveBtn.disabled = false; saveBtn.textContent = 'Сохранить';
  }
});

document.getElementById('drawer-delete').addEventListener('click', async ()=>{
  if(draftIsNew){ closeDrawer(); return; }
  if(!confirm(`Удалить клиента «${draft.name||draftId}»?`)) return;
  await deleteClient(draftId);
  closeDrawer();
});

/* ---------- Google Sheets backend bootstrap ---------- */

function setSync(state, label){
  syncDot.className = 'sync-dot' + (state==='off'?' off':state==='pending'?' pending':'');
  syncLabel.textContent = label;
}

async function refresh(silent){
  if(!silent) setSync('pending', 'Загрузка…');
  try{
    ALL = await apiList();
    hideAuthGate();
    setSync('on', 'Синхронизировано');
    footerNote.textContent = `${ALL.length} клиентов в базе · данные хранятся в Google Таблице`;
    renderAll();
  }catch(e){
    console.error(e);
    if(e && e.message === 'unauthorized'){
      setSync('off', 'Нужен код доступа');
    } else {
      setSync('off', 'Нет связи с таблицей');
    }
  }
}

document.getElementById('auth-submit').addEventListener('click', submitAuthKey);
document.getElementById('auth-input').addEventListener('keydown', e=>{ if(e.key==='Enter') submitAuthKey(); });
async function submitAuthKey(){
  const val = document.getElementById('auth-input').value.trim();
  if(!val) return;
  setAuthKey(val);
  await refresh(false);
}

async function boot(){
  if(!API_URL || API_URL.indexOf('PASTE_') === 0){
    setSync('off', 'Не настроен адрес API');
    footerNote.textContent = 'Укажите API_URL в начале файла — адрес развёрнутого Apps Script Web App.';
    return;
  }
  if(!getAuthKey()){
    showAuthGate('');
    setSync('off', 'Нужен код доступа');
    return;
  }
  await refresh(false);
  setInterval(()=>{
    const authVisible = !document.getElementById('auth-overlay').hidden;
    const typing = document.activeElement && document.activeElement.classList.contains('inline-edit');
    if(!authVisible && !typing) refresh(true);
  }, 20000);
}

renderAll();
boot();
</script>
</body>
</html>
